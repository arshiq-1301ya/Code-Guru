<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Photo Gallery</h1>
  </header>

  <main>
    <div class="container">

      <div class="card">
        <img src="images/college-fest.jpg" alt="Photo 1">
        <h2>College Fest</h2>
      </div>

      <div class="card">
        <img src="images/weekend.jpg" alt="Photo 2">
        <h2>Weekend Trip</h2>
      </div>

      <div class="card">
        <img src="images/friends.jpg" alt="Photo 3">
        <h2>With Friends</h2>
      </div>

      <div class="card">
        <img src="images/sunset.jpg" alt="Photo 4">
        <h2>Sunset View</h2>
      </div>

      <div class="card">
        <img src="images/family-junction.jpg" alt="Photo 5">
        <h2>Family Function</h2>
      </div>

      <div class="card">
        <img src="images/campus-life.jpg" alt="Photo 6">
        <h2>Campus Life</h2>
      </div>

      <div class="card">
        <img src="images/night-out.jpg" alt="Photo 7">
        <h2>Night Out</h2>
      </div>

      <div class="card">
        <img src="images/travel-memories.jpg" alt="Photo 8">
        <h2>Travel Memories</h2>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 My Photo Gallery. All rights reserved.</p>
  </footer>

</body>
</html>
